# System-wide Mesa / GL shader cache tuning.
# Install: /etc/environment.d/99-mesa-cache.conf
# Applies at login via systemd-user environment generators.

# Mesa GLSL on-disk cache: default 1 GiB is too small for a Steam Proton
# library of modern Vulkan titles. 5 GiB keeps a season's worth of shaders.
MESA_GLSL_CACHE_MAX_SIZE=5G
MESA_SHADER_CACHE_MAX_SIZE=5G

# Pack cache in a single file. Faster lookup on SATA/USB SSD than many small
# files; large wins on cold-start shader load.
MESA_DISK_CACHE_SINGLE_FILE=1

# NVIDIA GL cache size (harmless on AMD-only setups; present for completeness
# in case you run proprietary Nvidia from eGPU in future).
__GL_SHADER_DISK_CACHE_SIZE=5368709120
