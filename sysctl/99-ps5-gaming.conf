# PS5 Linux gaming tuning
# Install: /etc/sysctl.d/99-ps5-gaming.conf
# Apply: sudo sysctl --system

# --- Memory / swap ---
# Reduce swap pressure. PS5 has 14 GiB usable + 7 GiB zram.
# Default 60 pushes pages to swap too early for a gaming workload.
vm.swappiness=10

# Keep FS metadata cache longer. Faster repeated file open (game asset reload).
vm.vfs_cache_pressure=50

# Smaller dirty page thresholds. More frequent, smaller flushes.
# Prevents multi-GB write bursts that stall I/O during saves / shader cache dumps.
vm.dirty_ratio=10
vm.dirty_background_ratio=5

# --- Network ---
# BBR + fq: modern congestion control, lower latency + better WiFi throughput.
# Requires tcp_bbr kernel module (see modules-load.d/bbr.conf in this repo).
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# Allow BBR to use a wide pipe. Default max is too small for gigabit WiFi.
net.core.rmem_max=16777216
net.core.wmem_max=16777216

# UDP multiplayer game defaults.
net.core.rmem_default=2097152
net.core.wmem_default=2097152
net.core.netdev_max_backlog=5000

# --- inotify (Steam / Proton prefix watches) ---
# Steam Proton creates many file watches on wine prefix. Default is too low.
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024
